# Render blueprint for the API. Import the repo in Render and point it at
# this file (root directory: dastaan-api).
#
# The API is a persistent server, not serverless: the notification outbox
# (2-hour appointment reminders) and the nightly calendar snapshot are
# in-process schedulers that need a process that stays alive.
services:
  - type: web
    name: dastaan-api
    runtime: node
    plan: free # free instances sleep when idle — reminders resume on next request
    region: frankfurt # closest Render region to the UAE
    rootDir: dastaan-api
    # NODE_ENV=production makes `npm ci` skip devDependencies, so TypeScript
    # would be missing at build time and tsx missing at run time. Install dev
    # deps explicitly for the build, compile to dist/, then run plain node.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start # node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      # Supabase pooled connection string
      - key: DATABASE_URL
        sync: false
      # Signs session cookies. Never has to leave Render, so let Render
      # generate it — it will not prompt you for this one, and that's correct.
      - key: JWT_SECRET
        generateValue: true
      # Peppers the HMAC of the 4-digit staff codes. This one you MUST supply,
      # because Free instances have no shell — the seed runs from your machine,
      # and a code hashed with a different pepper will never verify here.
      # Use the exact same value as CODE_PEPPER in your local .env.
      # Changing it later invalidates every existing staff code.
      - key: CODE_PEPPER
        sync: false
      # the deployed web app's origin(s), comma separated
      - key: WEB_ORIGINS
        sync: false
      # notifications — console until Twilio/WhatsApp is connected
      - key: SMS_PROVIDER
        value: console
      - key: REVIEW_URL
        sync: false
      - key: GOOGLE_REVIEW_URL
        sync: false
      # Sign in with Google (clients only). Leave these unset and the feature
      # is simply off — the API answers 503 and the web app hides the button.
      # Create the credentials at console.cloud.google.com → APIs & Services
      # → Credentials → OAuth client ID → Web application.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # must match an authorised redirect URI on that OAuth client exactly
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # payments stay off until the salon is ready to take cards
      - key: PAYMENTS_ENABLED
        value: "0"
      - key: PAYMENT_MODES
        value: online,terminal
      # THE SALON'S Stripe account — money settles to them, not to us.
      # Start with the test key (sk_test_…) and only swap to live at go-live.
      - key: STRIPE_SECRET_KEY
        sync: false
      # from Stripe -> Developers -> Webhooks, endpoint https://<this-service>.onrender.com/payments/webhook
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # --- how a booking may be paid: the salon's commercial choice ---
      - key: PAY_NOW_ENABLED
        value: "1"
      - key: PAY_LATER_ENABLED
        value: "1"
      # a prepaid appointment cancelled this far ahead is refunded in full
      - key: REFUND_HOURS
        value: "24"
